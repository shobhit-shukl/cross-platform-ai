services:
  postgres:
    image: postgres:16-alpine
    container_name: crosspost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crosspost
      POSTGRES_PASSWORD: crosspost
      POSTGRES_DB: crosspost_ai
    ports:
      - "5432:5432"
    volumes:
      - crosspost_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosspost -d crosspost_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  crosspost_pgdata:
